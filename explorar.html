<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorar atividades — Agenda Livre</title>
  <link rel="icon" href="images/brand/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/poppins-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/pages/explore.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo principal</a>
  <header class="site-header">
    <a class="site-header__brand" href="index.html"><img src="images/brand/logo.svg" alt="Agenda Livre" width="104" height="52"></a>
    <button type="button" class="site-header__toggle" aria-expanded="false" aria-controls="site-nav-list" hidden>Menu</button>
    <nav class="site-nav" aria-label="Navegação principal">
      <ul id="site-nav-list">
          <li><a href="index.html">Início</a></li>
          <li><a href="explorar.html" aria-current="page">Explorar atividades</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>
  <main id="main-content" tabindex="-1">
    <h1>Explorar atividades</h1>
    <p>Encontre cursos, eventos e atividades nos CEUs.</p>

    <form id="explore-form" class="explore-filters" role="search" aria-label="Pesquisar atividades" action="explorar.html" method="get">
      <div class="explore-filters__field explore-filters__field--term">
        <label for="search-q">Buscar por nome da atividade</label>
        <input id="search-q" type="search" name="q" maxlength="100" autocomplete="off">
      </div>
      <div class="explore-filters__field">
        <label for="filter-unit">Unidade</label>
        <select id="filter-unit" name="unit" aria-describedby="filter-options-status">
          <option value="">Todas as unidades</option>
        </select>
      </div>
      <div class="explore-filters__field">
        <label for="filter-category">Categoria</label>
        <select id="filter-category" name="category" aria-describedby="filter-options-status">
          <option value="">Todas as categorias</option>
        </select>
      </div>
      <div class="explore-filters__field">
        <label for="filter-period">Quando?</label>
        <select id="filter-period" name="period">
          <option value="any">Qualquer data</option>
          <option value="today">Hoje</option>
          <option value="week">Próximos 7 dias</option>
          <option value="month">Este mês</option>
        </select>
      </div>
      <div class="explore-filters__actions">
        <button type="submit" id="explore-submit" class="button">Filtrar</button>
        <button type="button" id="explore-clear" class="button button--outline">Limpar filtros</button>
      </div>
      <p id="filter-options-status" class="explore-filters__notice" role="status"></p>
    </form>

    <section class="results" aria-labelledby="results-heading">
      <h2 id="results-heading" tabindex="-1">Resultados</h2>
      <p id="results-summary" class="results-summary"></p>
      <div id="results-status" class="visually-hidden" role="status" aria-live="polite"></div>
      <div id="results-content" class="card-grid"></div>
      <nav id="results-pagination" class="pagination" aria-label="Paginação" hidden></nav>
      <noscript><p>Para ver as atividades, ative o JavaScript no navegador.</p></noscript>
    </section>
  </main>
  <footer class="site-footer">
    <p>Agenda Livre</p>
    <nav aria-label="Rodapé">
      <ul>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </footer>
</body>
</html>
